<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title><%= page.title %></title>
        <meta name="description" content="<%= page.description %>" />
        <meta name="robots" content="<%= page.robots %>" />
        <link rel="canonical" href="<%= page.url %>" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="ICEIBank" />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:title" content="<%= page.title %>" />
        <meta property="og:description" content="<%= page.description %>" />
        <meta property="og:url" content="<%= page.url %>" />
        <meta property="og:image" content="<%= site.url %>/og-image.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="ICEIBank: um banco inteiro, três agências que nunca se confundem."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="<%= page.title %>" />
        <meta name="twitter:description" content="<%= page.description %>" />
        <meta name="twitter:image" content="<%= site.url %>/og-image.png" />

        <meta name="theme-color" content="#062017" />
        <meta name="application-name" content="ICEIBank" />
        <meta name="apple-mobile-web-app-title" content="ICEIBank" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script>
            (function () {
                var fallback = 'light';
                try {
                    var stored = localStorage.getItem('iceibank.theme');
                    fallback =
                        stored === 'light' || stored === 'dark'
                            ? stored
                            : window.matchMedia('(prefers-color-scheme: dark)').matches
                              ? 'dark'
                              : 'light';
                } catch (error) {
                    fallback = 'light';
                }
                document.documentElement.dataset.theme = fallback;
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
